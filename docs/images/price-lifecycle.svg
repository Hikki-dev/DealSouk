<text x="154" y="226" class="t">Share</text>
<text x="154" y="252" class="s">a price, with a photo</text>
<rect x="302" y="180" width="235" height="100" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2.4"/>
<rect x="302" y="180" width="9" height="100" rx="4" fill="#0f766e"/>
<text x="424" y="226" class="t">Review</text>
<text x="424" y="252" class="s">a moderator checks it</text>
