services:
  - type: web
    name: dealsouk-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run render:build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JSON_BODY_LIMIT
        value: 1mb
      - key: GLOBAL_RATE_LIMIT_PER_MINUTE
        value: 120
      - key: SUBMISSION_RATE_LIMIT_PER_MINUTE
        value: 5
      - key: REQUEST_RATE_LIMIT_PER_MINUTE
        value: 10
      - key: ADMIN_RATE_LIMIT_PER_MINUTE
        value: 60
      - key: MAINTENANCE_MODE
        value: false
