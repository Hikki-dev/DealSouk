name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - production
      - "feature/**"
      - "codex/**"

jobs:
  validate:
    name: Format, analyze, test, backend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Restore Firebase options from secret
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART_B64" ]; then
            echo "Missing FIREBASE_OPTIONS_DART_B64 secret. Store base64-encoded lib/firebase_options.dart in GitHub Secrets."
            exit 1
          fi
          echo "$FIREBASE_OPTIONS_DART_B64" | base64 --decode > lib/firebase_options.dart

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze Flutter
        run: flutter analyze

      - name: Test Flutter
        run: flutter test

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

