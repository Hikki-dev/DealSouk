<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="380" viewBox="0 0 1500 380" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Life of a shared price</title><desc id="d">A shopper shares a price with a photo. It waits for a moderator. Once approved it is shown to everyone for 72 hours and earns the shopper tokens. Enough tokens can be exchanged for a supermarket voucher.</desc><defs>
