<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" font-family="Readex Pro, Arial, sans-serif">
  <title>The journey of one price</title>
  <desc>Someone photographs a shelf price, the photo is cleaned and scanned, a moderator approves it, the price appears for every shopper and the contributor earns tokens.</desc>
  <rect width="1200" height="300" fill="#FBF6EC"/>
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#084F52"/></marker></defs>
  <g font-weight="700" fill="#1B2730" text-anchor="middle">
    <g><circle cx="110" cy="110" r="44" fill="#084F52"/><text x="110" y="124" font-size="38" fill="#fff">1</text>
      <text x="110" y="196" font-size="20">Photo</text><text x="110" y="224" font-size="15" font-weight="400" fill="#5B6770">A shopper shares</text><text x="110" y="244" font-size="15" font-weight="400" fill="#5B6770">a shelf price</text></g>
    <g><circle cx="350" cy="110" r="44" fill="#084F52"/><text x="350" y="124" font-size="38" fill="#fff">2</text>
      <text x="350" y="196" font-size="20">Cleaned</text><text x="350" y="224" font-size="15" font-weight="400" fill="#5B6770">Location data removed,</text><text x="350" y="244" font-size="15" font-weight="400" fill="#5B6770">virus scan</text></g>
    <g><circle cx="590" cy="110" r="44" fill="#084F52"/><text x="590" y="124" font-size="38" fill="#fff">3</text>
      <text x="590" y="196" font-size="20">Checked</text><text x="590" y="224" font-size="15" font-weight="400" fill="#5B6770">A moderator reviews</text><text x="590" y="244" font-size="15" font-weight="400" fill="#5B6770">the proof</text></g>
    <g><circle cx="830" cy="110" r="44" fill="#084F52"/><text x="830" y="124" font-size="38" fill="#fff">4</text>
      <text x="830" y="196" font-size="20">Live</text><text x="830" y="224" font-size="15" font-weight="400" fill="#5B6770">Everyone sees it,</text><text x="830" y="244" font-size="15" font-weight="400" fill="#5B6770">fresh for 72 hours</text></g>
    <g><circle cx="1070" cy="110" r="44" fill="#F2A91B"/><text x="1070" y="124" font-size="38" fill="#1B2730">5</text>
      <text x="1070" y="196" font-size="20">Rewarded</text><text x="1070" y="224" font-size="15" font-weight="400" fill="#5B6770">Tokens for the</text><text x="1070" y="244" font-size="15" font-weight="400" fill="#5B6770">contributor</text></g>
  </g>
  <g stroke="#084F52" stroke-width="3" marker-end="url(#b)"><path d="M160 110H296"/><path d="M400 110H536"/><path d="M640 110H776"/><path d="M880 110H1016"/></g>
</svg>
