name: Android Internal APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Production or staging API base URL
        required: true
        default: https://api.dealsouk.ae

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Firebase mobile config from secrets
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART_B64" ] || [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "Missing Firebase Android secrets. Configure FIREBASE_OPTIONS_DART_B64 and GOOGLE_SERVICES_JSON_B64."
            exit 1
          fi
          echo "$FIREBASE_OPTIONS_DART_B64" | base64 --decode > lib/firebase_options.dart
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ inputs.api_base_url }}
          --dart-define=ADMIN_MODE=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dealsouk-android-internal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

