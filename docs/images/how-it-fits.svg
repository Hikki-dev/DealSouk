<title id="t">How the pieces fit together</title><desc id="d">The shopper app and the admin portal are one Flutter code base. Both talk to one Express API, which keeps data in Postgres, checks Firebase sign-in tokens, hands out signed upload addresses for photos, sends push messages, and can optionally use Redis and a photo check.</desc><defs>
