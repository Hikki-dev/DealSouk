<text x="964" y="226" class="t">Earn</text>
<text x="964" y="252" class="s">50 tokens on approval</text>
<rect x="1112" y="180" width="235" height="100" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="2.4"/>
