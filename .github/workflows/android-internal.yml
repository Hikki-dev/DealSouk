name: Android Internal APK

on:
  # Auto-build on every push to main so you always have fresh APKs waiting.
  push:
    branches:
      - main
    # Also cut a versioned release when you push a tag (e.g. git tag v2.1.0).
    # The tag name (minus the leading v) becomes the app versionName.
    tags:
      - 'v*'
  # Manual trigger for ad-hoc builds against a staging URL.
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Production or staging API base URL
        required: true
        default: https://dealsouk.onrender.com

permissions:
  contents: write

# A newer run for the same ref cancels the older one — no more competing builds
# when you push twice in a row.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://dealsouk.onrender.com' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Derive version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.0.0-dev"
          fi
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          # versionCode must strictly increase for every build; run_number does.
          echo "code=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$VERSION_NAME (versionCode=$GITHUB_RUN_NUMBER)"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Secret scan
        run: python3 scripts/secret_scan.py

      - name: Restore Firebase mobile config from secrets
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART_B64" ] || [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "Missing Firebase Android secrets. Configure FIREBASE_OPTIONS_DART_B64 and GOOGLE_SERVICES_JSON_B64."
            exit 1
          fi
          echo "$FIREBASE_OPTIONS_DART_B64" | tr -d '\r\n ' | base64 --decode > lib/firebase_options.dart
          dart format lib/firebase_options.dart
          echo "$GOOGLE_SERVICES_JSON_B64" | tr -d '\r\n ' | base64 --decode > android/app/google-services.json

      - name: Restore Android release keystore from secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE_B64" ] || \
             [ -z "$ANDROID_UPLOAD_STORE_PASSWORD" ] || \
             [ -z "$ANDROID_UPLOAD_KEY_ALIAS" ] || \
             [ -z "$ANDROID_UPLOAD_KEY_PASSWORD" ]; then
            echo "Missing Android signing secrets. Configure ANDROID_UPLOAD_KEYSTORE_B64, ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, and ANDROID_UPLOAD_KEY_PASSWORD."
            exit 1
          fi
          echo "$ANDROID_UPLOAD_KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > android/app/upload-keystore.jks
          cat > /tmp/ValidateKeystore.java <<'JAVA'
          import java.io.FileInputStream;
          import java.security.KeyStore;

          public class ValidateKeystore {
            public static void main(String[] args) throws Exception {
              if (args.length != 4) {
                throw new IllegalArgumentException("Expected: keystore storePassword keyAlias keyPassword");
              }

              KeyStore keyStore = KeyStore.getInstance(KeyStore.getDefaultType());
              try (FileInputStream input = new FileInputStream(args[0])) {
                keyStore.load(input, args[1].toCharArray());
              }

              if (!keyStore.containsAlias(args[2])) {
                throw new IllegalArgumentException("Android upload key alias was not found in the keystore.");
              }

              if (keyStore.getKey(args[2], args[3].toCharArray()) == null) {
                throw new IllegalArgumentException("Android upload key could not be read.");
              }
            }
          }
          JAVA
          javac /tmp/ValidateKeystore.java
          java -cp /tmp ValidateKeystore \
            android/app/upload-keystore.jks \
            "$ANDROID_UPLOAD_STORE_PASSWORD" \
            "$ANDROID_UPLOAD_KEY_ALIAS" \
            "$ANDROID_UPLOAD_KEY_PASSWORD"

      # Must run before any raw Gradle invocation: `flutter pub get` generates
      # android/local.properties (flutter.sdk + sdk.dir), which settings.gradle.kts
      # reads at configuration time. Without it, `./gradlew :app:signingReport`
      # fails with "android/local.properties (No such file or directory)".
      - name: Install dependencies
        run: flutter pub get

      - name: Show Android release signing fingerprint
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ github.workspace }}/android/app/upload-keystore.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: cd android && ./gradlew :app:signingReport

      - name: Build Shopper APKs (split-per-abi + universal)
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ github.workspace }}/android/app/upload-keystore.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ADMIN_MODE=false \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN"
          mkdir -p build/outputs
          # arm64-v8a covers ~98 % of modern Android — use it as the shareable universal APK
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/outputs/DealSouk-Shopper.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/outputs/DealSouk-Shopper-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/outputs/DealSouk-Shopper-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/outputs/DealSouk-Shopper-x86_64.apk

      - name: Build Admin APK (Moderator Mode)
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ github.workspace }}/android/app/upload-keystore.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=ADMIN_MODE=true \
            --dart-define=MAPBOX_ACCESS_TOKEN="$MAPBOX_ACCESS_TOKEN"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/outputs/DealSouk-Admin.apk

      - name: Upload Shopper APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dealsouk-Shopper-APK
          path: |
            build/outputs/DealSouk-Shopper.apk
            build/outputs/DealSouk-Shopper-arm64-v8a.apk
            build/outputs/DealSouk-Shopper-armeabi-v7a.apk
            build/outputs/DealSouk-Shopper-x86_64.apk
          if-no-files-found: error

      - name: Upload Admin APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dealsouk-Admin-APK
          path: build/outputs/DealSouk-Admin.apk
          if-no-files-found: error

      # On a version tag, create (or update) the matching GitHub Release and
      # attach every APK. Manual (workflow_dispatch) runs skip this and just
      # leave the APKs as downloadable build artifacts above.
      - name: Publish release with APKs
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: DealSouk ${{ github.ref_name }}
          body: Internal Android APKs for DealSouk ${{ github.ref_name }}.
          files: |
            build/outputs/DealSouk-Shopper.apk
            build/outputs/DealSouk-Shopper-arm64-v8a.apk
            build/outputs/DealSouk-Shopper-armeabi-v7a.apk
            build/outputs/DealSouk-Shopper-x86_64.apk
            build/outputs/DealSouk-Admin.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
