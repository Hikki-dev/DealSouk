name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - production
      - stabilize/mvp-audit
      - "feature/**"
      - "codex/**"

jobs:
  validate:
    name: Format, analyze, test, backend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            firebase/functions/package-lock.json

      - name: Secret scan
        run: python3 scripts/secret_scan.py

      - name: Restore Firebase options from secret
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART_B64" ]; then
            echo "Missing FIREBASE_OPTIONS_DART_B64 secret. Store base64-encoded lib/firebase_options.dart in GitHub Secrets."
            exit 1
          fi
          echo "$FIREBASE_OPTIONS_DART_B64" | base64 --decode > lib/firebase_options.dart

      - name: Install Flutter dependencies
        run: flutter pub get

      # Format the generated file only after `pub get`: before it there is no
      # package config, so the formatter uses an older language version and the
      # later `dart format .` check would always rewrite this file and fail.
      - name: Format generated Firebase options
        run: dart format lib/firebase_options.dart

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze Flutter
        run: flutter analyze

      - name: Test Flutter
        run: flutter test

      - name: Install backend dependencies
        working-directory: backend
        # Use `npm install` (not `npm ci`): jest pulls optional native deps
        # (@emnapi/*) that resolve per-platform, so a Mac-generated lockfile can
        # be missing the Linux variants and trip `npm ci`'s strict check.
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Test backend (Jest)
        working-directory: backend
        run: npm test

      - name: Install Firebase Functions dependencies
        working-directory: firebase/functions
        run: npm ci

      - name: Build Firebase Functions
        working-directory: firebase/functions
        run: npm run build
