<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Readex Pro, Arial, sans-serif">
  <title>How DealSouk fits together</title>
  <desc>The shopper app and the moderator console talk to one API. The API keeps data in Postgres and uses Firebase for sign in, photos and notifications.</desc>
  <rect width="1200" height="560" fill="#FBF6EC"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#084F52"/></marker>
  </defs>
  <g font-size="22" font-weight="700" fill="#1B2730" text-anchor="middle">
    <rect x="40" y="60" width="280" height="110" rx="20" fill="#fff" stroke="#E4DCCB" stroke-width="2"/>
    <text x="180" y="108">Shopper app</text>
    <text x="180" y="140" font-size="16" font-weight="400" fill="#5B6770">Phone, tablet, desktop</text>
    <rect x="40" y="230" width="280" height="110" rx="20" fill="#fff" stroke="#E4DCCB" stroke-width="2"/>
    <text x="180" y="278">Moderator console</text>
    <text x="180" y="310" font-size="16" font-weight="400" fill="#5B6770">Review, approve, reward</text>
    <rect x="460" y="130" width="280" height="150" rx="20" fill="#084F52"/>
    <text x="600" y="190" fill="#fff">DealSouk API</text>
    <text x="600" y="224" font-size="16" font-weight="400" fill="#D5ECEA">Checks every request</text>
    <text x="600" y="250" font-size="16" font-weight="400" fill="#D5ECEA">Counts tokens safely</text>
    <rect x="880" y="40" width="280" height="110" rx="20" fill="#fff" stroke="#E4DCCB" stroke-width="2"/>
    <text x="1020" y="88">Postgres</text>
    <text x="1020" y="120" font-size="16" font-weight="400" fill="#5B6770">Prices, users, rewards</text>
    <rect x="880" y="215" width="280" height="110" rx="20" fill="#fff" stroke="#E4DCCB" stroke-width="2"/>
    <text x="1020" y="263">Firebase</text>
    <text x="1020" y="295" font-size="16" font-weight="400" fill="#5B6770">Sign in, photos, alerts</text>
    <rect x="880" y="390" width="280" height="110" rx="20" fill="#fff" stroke="#E4DCCB" stroke-width="2"/>
    <text x="1020" y="438">Photo checks</text>
    <text x="1020" y="470" font-size="16" font-weight="400" fill="#5B6770">Privacy strip, virus scan</text>
  </g>
  <g stroke="#084F52" stroke-width="3" fill="none" marker-end="url(#a)">
    <path d="M320 115 C 400 115, 400 170, 455 175"/>
    <path d="M320 285 C 400 285, 400 240, 455 235"/>
    <path d="M740 175 C 800 175, 820 110, 875 100"/>
    <path d="M740 215 C 800 215, 820 255, 875 265"/>
    <path d="M1020 325 L 1020 385"/>
  </g>
  <g font-size="15" fill="#5B6770" text-anchor="middle">
    <text x="400" y="90">sign-in token</text>
    <text x="810" y="140">saves data</text>
    <text x="810" y="300">checks who you are</text>
    <text x="1085" y="360">every photo</text>
  </g>
</svg>
